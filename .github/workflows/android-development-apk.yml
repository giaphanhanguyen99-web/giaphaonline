name: Android Development APK

on:
  workflow_dispatch:
  push:
    branches:
      - gia-pha-development-2026-11-25
    paths:
      - "android-app/**"
      - ".github/workflows/android-development-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false
      - name: Install Android build packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle -p android-app assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coi-nguon-android-development
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
